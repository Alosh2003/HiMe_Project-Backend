openapi: 3.1.0
info:
  title: AI Job Matching Platform - Sprint 1 API
  description: Official API Documentation for Sprint 1 focusing on Authentication, Job Seeker Profile Management, and Resume Upload.
  version: 1.0.0
servers:
  - url: https://api.smartjobmatch.com/v1
    description: Production Server
  - url: http://localhost:8000/v1
    description: Local Development Server

paths:
  # ==========================================
  # AUTHENTICATION ENDPOINTS
  # ==========================================
  /auth/register:
    post:
      summary: Register a new user
      description: Creates a user account and automatically initializes a Job Seeker profile.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: sam@example.com
                password:
                  type: string
                  format: password
                  example: "StrongPassword123!"
      responses:
        "201":
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseUser"
        "400":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /auth/login:
    post:
      summary: Authenticate user & get JWT
      description: Validates user credentials and returns a Bearer Token along with basic user info.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: sam@example.com
                password:
                  type: string
                  format: password
                  example: "StrongPassword123!"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseLogin"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  # ==========================================
  # PROFILE ENDPOINTS
  # ==========================================
  /seekers/profile:
    get:
      summary: Get current Job Seeker profile
      tags:
        - Profile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

    put:
      summary: Update Job Seeker profile
      tags:
        - Profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseProfileUpdate"
        "400":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  # ==========================================
  # RESUME ENDPOINTS
  # ==========================================
  /seekers/resume:
    post:
      summary: Upload Job Seeker resume
      tags:
        - Resume
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - resume
              properties:
                resume:
                  type: string
                  format: binary
                  description: PDF or DOCX resume file
      responses:
        "200":
          description: Resume uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseResumeUpload"
        "400":
          description: Invalid file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /seekers/resume/status:
    get:
      summary: Get resume parsing/processing status
      tags:
        - Resume
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Resume status retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseResumeStatus"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

# ==========================================
# COMPONENTS & SCHEMAS
# ==========================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # --- Standard Error Response ---
    ApiErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Validation Error"
        errors:
          type: array
          items:
            type: string
          example: ["Email is invalid or already taken."]

    # --- User Data Models ---
    UserObject:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11"
        email:
          type: string
          format: email
          example: "sam@example.com"
        role:
          type: string
          enum: [job_seeker]
          example: "job_seeker"

    # --- Auth Responses ---
    ApiResponseUser:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Account created successfully"
        data:
          $ref: "#/components/schemas/UserObject"

    ApiResponseLogin:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Login successful"
        data:
          type: object
          properties:
            access_token:
              type: string
              example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
            token_type:
              type: string
              example: "Bearer"
            user:
              $ref: "#/components/schemas/UserObject"

    # --- Profile Models & Responses ---
    UpdateProfileRequest:
      type: object
      required:
        - first_name
        - last_name
      properties:
        first_name:
          type: string
          example: "Sam"
        last_name:
          type: string
          example: "Ahmed"
        phone:
          type: string
          example: "+9677xxxxxxx"

    ApiResponseProfile:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: "b1f3c880-2a1e-4b90-98d0-1c3e1e240a22"
            user_id:
              type: string
              format: uuid
              example: "a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11"
            first_name:
              type: string
              nullable: true
              example: "Sam"
            last_name:
              type: string
              nullable: true
              example: "Ahmed"
            phone:
              type: string
              nullable: true
              example: "+9677xxxxxxx"
            resume_url:
              type: string
              nullable: true
              example: "https://storage.smartjobmatch.com/resumes/sam_resume.pdf"
            resume_status:
              type: string
              enum: [pending, processing, completed, failed]
              example: "pending"
            created_at:
              type: string
              format: date-time
              example: "2026-07-28T18:00:00Z"
            updated_at:
              type: string
              format: date-time
              example: "2026-07-28T18:30:00Z"

    ApiResponseProfileUpdate:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Profile updated successfully"
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: "b1f3c880-2a1e-4b90-98d0-1c3e1e240a22"
            first_name:
              type: string
              example: "Sam"
            last_name:
              type: string
              example: "Ahmed"
            phone:
              type: string
              example: "+9677xxxxxxx"

    # --- Resume Responses ---
    ApiResponseResumeUpload:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Resume uploaded successfully"
        data:
          type: object
          properties:
            resume_url:
              type: string
              example: "https://storage.smartjobmatch.com/resumes/sam_resume.pdf"
            resume_status:
              type: string
              enum: [pending, processing, completed, failed]
              example: "pending"

    ApiResponseResumeStatus:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            resume_status:
              type: string
              enum: [pending, processing, completed, failed]
              example: "pending"
